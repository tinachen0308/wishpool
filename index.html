<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>許願池 · Wishing Pool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Sans+TC:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;1,300&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --rose: #e8b4c8;
      --rose-light: #f2d4e3;
      --peach: #f0c4a0;
      --peach-light: #f8dfc8;
      --sky: #b8d4f0;
      --sky-light: #d4e8f8;
      --lavender: #d4b8e8;
      --lavender-light: #ead4f4;
      --gold: #e8c878;
      --gold-light: #f4e0a8;
      --white-glow: rgba(255,255,255,0.9);
      --white-mid: rgba(255,255,255,0.6);
      --white-soft: rgba(255,255,255,0.35);
      --white-ghost: rgba(255,255,255,0.15);
      --dark-text: #5a4060;
      --mid-text: #8a6880;
      --soft-text: #b09aac;
      --card-bg: rgba(255,255,255,0.22);
      --card-border: rgba(255,255,255,0.5);
      --radius: 20px;
      --radius-sm: 12px;
      --font-serif: 'Cormorant Garamond', serif;
      --font-sans: 'Noto Sans TC', sans-serif;
      --font-display: 'Playfair Display', serif;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-sans);
      min-height: 100vh;
      color: var(--dark-text);
      overflow-x: hidden;
      background: #e8d4f0;
    }

    /* ══════════════════════════════════════
       CELESTIAL BACKGROUND
    ══════════════════════════════════════ */
    .bg-canvas {
      position: fixed; inset: 0; z-index: 0;
      background:
              radial-gradient(ellipse 120% 80% at 15% 10%, rgba(184,212,240,0.9) 0%, transparent 55%),
              radial-gradient(ellipse 100% 70% at 85% 5%,  rgba(240,196,160,0.75) 0%, transparent 50%),
              radial-gradient(ellipse 80%  90% at 50% 110%, rgba(212,184,232,0.8) 0%, transparent 55%),
              radial-gradient(ellipse 60%  60% at 30% 60%,  rgba(232,180,200,0.55) 0%, transparent 50%),
              radial-gradient(ellipse 70%  50% at 80% 70%,  rgba(248,223,200,0.6) 0%, transparent 50%),
              linear-gradient(160deg, #c8dcf0 0%, #e4c8dc 30%, #f0d4c0 60%, #e0c8e8 100%);
    }

    /* Soft cloud wisps */
    .bg-canvas::before {
      content: '';
      position: absolute; inset: 0;
      background:
              radial-gradient(ellipse 200px 60px at 20% 25%, rgba(255,255,255,0.5) 0%, transparent 70%),
              radial-gradient(ellipse 150px 40px at 70% 15%, rgba(255,255,255,0.4) 0%, transparent 70%),
              radial-gradient(ellipse 250px 70px at 50% 40%, rgba(255,255,255,0.3) 0%, transparent 70%),
              radial-gradient(ellipse 180px 50px at 85% 55%, rgba(255,255,255,0.35) 0%, transparent 70%);
    }

    /* Central divine light */
    .divine-light {
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 400px; height: 500px;
      background: radial-gradient(ellipse at 50% 20%, rgba(255,255,255,0.7) 0%, rgba(255,240,220,0.3) 40%, transparent 75%);
      pointer-events: none;
      z-index: 1;
      animation: breathe 6s ease-in-out infinite;
    }
    @keyframes breathe {
      0%,100% { opacity: 0.7; transform: translateX(-50%) scaleY(1); }
      50% { opacity: 1; transform: translateX(-50%) scaleY(1.08); }
    }

    /* Stars */
    .starfield {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
    }
    .star {
      position: absolute;
      border-radius: 50%;
      background: white;
      animation: starTwinkle var(--d) ease-in-out infinite var(--delay);
    }
    @keyframes starTwinkle {
      0%,100% { opacity: 0.1; transform: scale(0.7); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    /* Metatron Cube (decorative, top center) */
    .metatron-wrap {
      position: fixed;
      top: -60px; left: 50%;
      transform: translateX(-50%);
      width: 240px; height: 240px;
      z-index: 2; pointer-events: none;
      opacity: 0.18;
      animation: metatronSpin 60s linear infinite;
    }
    @keyframes metatronSpin { to { transform: translateX(-50%) rotate(360deg); } }

    /* Wing silhouettes */
    .wings {
      position: fixed;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: min(900px, 100vw);
      pointer-events: none;
      z-index: 1;
      opacity: 0.12;
    }

    /* ══════════════════════════════════════
       LAYOUT
    ══════════════════════════════════════ */
    .page {
      position: relative; z-index: 10;
      min-height: 100vh;
      max-width: 780px;
      margin: 0 auto;
      padding: 0 20px 100px;
    }

    /* ══════════════════════════════════════
       HEADER
    ══════════════════════════════════════ */
    header {
      text-align: center;
      padding: 64px 0 36px;
    }

    .header-eyebrow {
      font-family: var(--font-sans);
      font-size: 0.7rem;
      font-weight: 300;
      letter-spacing: 0.35em;
      color: var(--mid-text);
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    header h1 {
      font-family: var(--font-serif);
      font-size: clamp(3rem, 8vw, 5rem);
      font-weight: 300;
      font-style: italic;
      line-height: 1.1;
      color: var(--dark-text);
      letter-spacing: 0.03em;
      text-shadow: 0 2px 30px rgba(255,255,255,0.8);
    }

    header h1 em {
      font-style: normal;
      background: linear-gradient(135deg, #c070a0, #a080c0, #6090c8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-sub {
      margin-top: 14px;
      font-family: var(--font-sans);
      font-size: 0.82rem;
      font-weight: 300;
      letter-spacing: 0.12em;
      color: var(--soft-text);
    }

    /* Divider */
    .divine-divider {
      display: flex; align-items: center; gap: 16px;
      margin: 28px 0;
    }
    .divine-divider::before, .divine-divider::after {
      content: '';
      flex: 1;
      height: 0.5px;
      background: linear-gradient(90deg, transparent, rgba(160,120,180,0.4), transparent);
    }
    .divine-divider span {
      font-size: 1rem;
      color: var(--rose);
      opacity: 0.7;
    }

    /* ══════════════════════════════════════
       NAV
    ══════════════════════════════════════ */
    .nav-pills {
      display: flex; gap: 10px; justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 36px;
    }
    .pill {
      padding: 9px 26px;
      border-radius: 50px;
      border: 1px solid rgba(180,140,200,0.35);
      background: rgba(255,255,255,0.4);
      color: var(--mid-text);
      font-family: var(--font-sans);
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .pill:hover {
      background: rgba(255,255,255,0.6);
      border-color: rgba(180,140,200,0.6);
      color: var(--dark-text);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(180,140,200,0.2);
    }
    .pill.active {
      background: rgba(255,255,255,0.75);
      border-color: rgba(180,140,200,0.7);
      color: var(--dark-text);
      box-shadow: 0 4px 20px rgba(180,140,200,0.25);
    }

    /* ══════════════════════════════════════
       SECTIONS
    ══════════════════════════════════════ */
    .section { display: none; }
    .section.active { display: block; }

    /* ══════════════════════════════════════
       TRENDING BANNER
    ══════════════════════════════════════ */
    .trending-wrap {
      background: linear-gradient(135deg, rgba(255,255,255,0.35), rgba(255,255,255,0.2));
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: var(--radius);
      padding: 20px 24px;
      margin-bottom: 24px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .trending-title {
      font-family: var(--font-serif);
      font-size: 0.95rem;
      font-style: italic;
      color: var(--mid-text);
      margin-bottom: 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .trending-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .trending-chip {
      padding: 5px 14px;
      border-radius: 50px;
      background: linear-gradient(135deg, rgba(232,180,200,0.4), rgba(212,184,232,0.4));
      border: 1px solid rgba(200,160,220,0.4);
      font-size: 0.78rem;
      color: var(--mid-text);
      display: flex; align-items: center; gap: 6px;
    }
    .chip-count {
      background: rgba(180,140,200,0.3);
      border-radius: 50px;
      padding: 1px 8px;
      font-size: 0.7rem;
      color: var(--dark-text);
    }

    /* ══════════════════════════════════════
       USER POOL CARD
    ══════════════════════════════════════ */
    .pools-list { display: flex; flex-direction: column; gap: 16px; }

    .pool-card {
      background: linear-gradient(145deg, rgba(255,255,255,0.38), rgba(255,255,255,0.2));
      border: 1px solid rgba(255,255,255,0.65);
      border-radius: var(--radius);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      overflow: hidden;
      transition: box-shadow 0.3s ease, transform 0.3s ease;
    }
    .pool-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(180,140,200,0.2);
    }

    .pool-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 20px 22px;
    }

    .avatar-ring {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--rose), var(--lavender), var(--sky));
      padding: 1.5px;
      flex-shrink: 0;
      position: relative;
    }
    .avatar-inner {
      width: 100%; height: 100%;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255,255,255,0.8), rgba(255,255,255,0.5));
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-serif);
      font-size: 1.2rem;
      color: var(--mid-text);
    }

    .pool-meta { flex: 1; min-width: 0; }
    .pool-name {
      font-family: var(--font-serif);
      font-size: 1.15rem;
      font-weight: 400;
      color: var(--dark-text);
      letter-spacing: 0.02em;
    }
    .pool-count {
      font-size: 0.75rem;
      color: var(--soft-text);
      margin-top: 3px;
      font-weight: 300;
    }

    .pool-actions { display: flex; align-items: center; gap: 8px; }

    .btn-edit {
      padding: 7px 18px;
      border-radius: 50px;
      border: 1px solid rgba(180,140,200,0.45);
      background: rgba(255,255,255,0.5);
      color: var(--mid-text);
      font-family: var(--font-sans);
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.25s;
      white-space: nowrap;
    }
    .btn-edit:hover {
      background: rgba(255,255,255,0.8);
      border-color: rgba(180,140,200,0.7);
      color: var(--dark-text);
    }

    .btn-expand {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(180,140,200,0.35);
      background: rgba(255,255,255,0.4);
      color: var(--soft-text);
      font-size: 0.75rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.3s;
      flex-shrink: 0;
    }
    .btn-expand:hover { background: rgba(255,255,255,0.7); }
    .pool-card.expanded .btn-expand { transform: rotate(180deg); }

    /* Wish list */
    .wish-collapse { max-height: 0; overflow: hidden; transition: max-height 0.45s cubic-bezier(0.4,0,0.2,1); }
    .pool-card.expanded .wish-collapse { max-height: 2000px; }

    .wish-list-body { padding: 0 20px 20px; }

    .wish-row {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      background: rgba(255,255,255,0.3);
      border: 1px solid rgba(255,255,255,0.55);
      transition: background 0.2s;
    }
    .wish-row:last-child { margin-bottom: 0; }
    .wish-row:hover { background: rgba(255,255,255,0.5); }

    .wish-num {
      width: 22px; height: 22px; border-radius: 50%;
      background: linear-gradient(135deg, rgba(212,184,232,0.5), rgba(232,180,200,0.5));
      border: 1px solid rgba(200,160,220,0.4);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem; color: var(--mid-text);
      flex-shrink: 0; margin-top: 1px;
    }

    .wish-body { flex: 1; min-width: 0; }
    .wish-title {
      font-family: var(--font-sans);
      font-size: 0.88rem;
      color: var(--dark-text);
      font-weight: 400;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .done-badge {
      font-size: 0.65rem;
      background: linear-gradient(135deg, rgba(160,220,180,0.4), rgba(140,200,200,0.4));
      border: 1px solid rgba(140,200,180,0.5);
      color: #4a9070;
      padding: 2px 9px;
      border-radius: 50px;
    }

    .wish-detail {
      max-height: 0; overflow: hidden;
      transition: max-height 0.35s ease;
    }
    .wish-detail.open { max-height: 200px; }
    .wish-detail-inner {
      margin-top: 8px;
      font-size: 0.78rem;
      color: var(--soft-text);
      line-height: 1.65;
    }
    .wish-detail-inner a {
      color: var(--sky);
      text-decoration: none;
      word-break: break-all;
    }
    .wish-detail-inner a:hover { color: var(--lavender); }

    .btn-detail {
      background: none;
      border: 1px solid rgba(180,140,200,0.3);
      color: var(--soft-text);
      font-size: 0.68rem;
      padding: 3px 11px;
      border-radius: 50px;
      cursor: pointer;
      font-family: var(--font-sans);
      transition: all 0.2s;
      flex-shrink: 0;
      margin-top: 1px;
      letter-spacing: 0.04em;
    }
    .btn-detail:hover { background: rgba(255,255,255,0.4); color: var(--mid-text); }

    /* ══════════════════════════════════════
       GLASS FORM
    ══════════════════════════════════════ */
    .glass-panel {
      background: linear-gradient(145deg, rgba(255,255,255,0.42), rgba(255,255,255,0.22));
      border: 1px solid rgba(255,255,255,0.65);
      border-radius: var(--radius);
      padding: 32px 28px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    @media (max-width: 520px) { .glass-panel { padding: 22px 18px; } }

    .form-legend {
      font-family: var(--font-serif);
      font-size: 1.05rem;
      font-style: italic;
      color: var(--mid-text);
      margin-bottom: 20px;
      letter-spacing: 0.03em;
      display: flex; align-items: center; gap: 10px;
    }
    .form-legend::after {
      content: '';
      flex: 1;
      height: 0.5px;
      background: linear-gradient(90deg, rgba(180,140,200,0.35), transparent);
    }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } }

    .fgroup { margin-bottom: 14px; }
    .fgroup label {
      display: block;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      color: var(--soft-text);
      margin-bottom: 7px;
      text-transform: uppercase;
      font-weight: 400;
    }
    .fgroup input, .fgroup textarea {
      width: 100%;
      background: rgba(255,255,255,0.45);
      border: 1px solid rgba(200,160,220,0.3);
      border-radius: var(--radius-sm);
      padding: 11px 16px;
      color: var(--dark-text);
      font-size: 0.88rem;
      font-family: var(--font-sans);
      transition: all 0.25s;
      outline: none;
      -webkit-appearance: none;
    }
    .fgroup input::placeholder, .fgroup textarea::placeholder {
      color: var(--soft-text);
      opacity: 0.7;
      font-weight: 300;
    }
    .fgroup input:focus, .fgroup textarea:focus {
      border-color: rgba(180,140,200,0.6);
      background: rgba(255,255,255,0.65);
      box-shadow: 0 0 0 3px rgba(180,140,200,0.12);
    }
    .fgroup textarea { resize: vertical; min-height: 72px; line-height: 1.6; }
    input[type="date"] { color-scheme: light; }

    /* ══════════════════════════════════════
       WISH ITEM FORM
    ══════════════════════════════════════ */
    .wish-form-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 14px; }

    .wish-form-item {
      background: rgba(255,255,255,0.3);
      border: 1px solid rgba(255,255,255,0.55);
      border-radius: var(--radius-sm);
      padding: 16px 16px 12px;
      position: relative;
    }

    .wfi-handle {
      text-align: center;
      color: var(--soft-text);
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      margin-bottom: 10px;
      cursor: grab;
      user-select: none;
    }

    .wfi-remove {
      position: absolute; top: 12px; right: 12px;
      width: 24px; height: 24px;
      border-radius: 50%;
      border: 1px solid rgba(200,140,160,0.4);
      background: rgba(255,255,255,0.5);
      color: #c08090;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .wfi-remove:hover { background: rgba(255,200,210,0.5); }

    .btn-add-wish {
      width: 100%;
      border: 1.5px dashed rgba(180,140,200,0.4);
      background: rgba(255,255,255,0.2);
      color: var(--soft-text);
      font-family: var(--font-sans);
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      padding: 11px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.25s;
    }
    .btn-add-wish:hover { background: rgba(255,255,255,0.4); color: var(--mid-text); border-color: rgba(180,140,200,0.6); }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 13px 32px;
      border-radius: 50px;
      font-family: var(--font-sans);
      font-size: 0.82rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      border: none;
      transition: all 0.3s ease;
      font-weight: 400;
    }
    .btn-primary {
      background: linear-gradient(135deg, rgba(200,160,220,0.7), rgba(232,180,200,0.7));
      border: 1px solid rgba(255,255,255,0.6);
      color: white;
      box-shadow: 0 4px 20px rgba(180,140,200,0.3);
      text-shadow: 0 1px 3px rgba(120,80,140,0.3);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, rgba(180,140,200,0.85), rgba(220,160,185,0.85));
      transform: translateY(-1px);
      box-shadow: 0 8px 28px rgba(180,140,200,0.4);
    }
    .btn-soft {
      background: rgba(255,255,255,0.5);
      border: 1px solid rgba(200,160,220,0.35);
      color: var(--mid-text);
    }
    .btn-soft:hover { background: rgba(255,255,255,0.75); }
    .btn-full { width: 100%; }

    /* ══════════════════════════════════════
       MANAGE PANEL
    ══════════════════════════════════════ */
    .manage-item {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 14px;
      background: rgba(255,255,255,0.3);
      border: 1px solid rgba(255,255,255,0.55);
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
    }
    .manage-item input[type="checkbox"] {
      width: 17px; height: 17px;
      accent-color: #a080c0;
      flex-shrink: 0; cursor: pointer;
    }
    .manage-name { flex: 1; font-size: 0.86rem; color: var(--dark-text); }
    .manage-name.done { text-decoration: line-through; color: var(--soft-text); }
    .btn-micro {
      background: rgba(255,255,255,0.5);
      border: 1px solid rgba(200,160,220,0.3);
      color: var(--soft-text);
      font-family: var(--font-sans);
      font-size: 0.68rem;
      padding: 4px 12px;
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-micro:hover { background: rgba(255,255,255,0.75); color: var(--mid-text); }
    .btn-micro.danger { border-color: rgba(200,140,150,0.4); color: #c08090; }
    .btn-micro.danger:hover { background: rgba(255,210,215,0.4); }

    /* ══════════════════════════════════════
       MODAL
    ══════════════════════════════════════ */
    .modal-veil {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(80,40,100,0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
    }
    .modal-veil.open { opacity: 1; pointer-events: all; }

    .modal-box {
      background: linear-gradient(145deg, rgba(240,232,250,0.97), rgba(250,240,248,0.97));
      border: 1px solid rgba(255,255,255,0.8);
      border-radius: var(--radius);
      padding: 32px 28px;
      width: 100%; max-width: 460px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 24px 60px rgba(120,80,160,0.25);
      transform: translateY(12px);
      transition: transform 0.3s;
    }
    .modal-veil.open .modal-box { transform: translateY(0); }

    .modal-close {
      position: absolute; top: 16px; right: 18px;
      background: none; border: none;
      font-size: 1.2rem; color: var(--soft-text);
      cursor: pointer; transition: color 0.2s;
    }
    .modal-close:hover { color: var(--mid-text); }

    .modal-title {
      font-family: var(--font-serif);
      font-size: 1.4rem;
      font-style: italic;
      font-weight: 300;
      color: var(--dark-text);
      margin-bottom: 22px;
    }

    /* ══════════════════════════════════════
       TOAST
    ══════════════════════════════════════ */
    .toast {
      position: fixed;
      bottom: 90px; left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: linear-gradient(135deg, rgba(200,160,220,0.92), rgba(232,180,200,0.92));
      border: 1px solid rgba(255,255,255,0.6);
      color: white;
      padding: 11px 26px;
      border-radius: 50px;
      font-size: 0.82rem;
      letter-spacing: 0.05em;
      z-index: 300;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      text-shadow: 0 1px 3px rgba(120,80,140,0.3);
      backdrop-filter: blur(8px);
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ══════════════════════════════════════
       MUSIC BTN
    ══════════════════════════════════════ */
    .music-fab {
      position: fixed;
      bottom: 28px; right: 24px;
      width: 52px; height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(212,184,232,0.7), rgba(232,180,200,0.7));
      border: 1px solid rgba(255,255,255,0.7);
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      z-index: 100;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(180,140,200,0.3);
      transition: all 0.3s;
    }
    .music-fab:hover { transform: scale(1.08); box-shadow: 0 6px 28px rgba(180,140,200,0.45); }
    .music-fab.playing { animation: fabPulse 2s ease-in-out infinite; }
    @keyframes fabPulse {
      0%,100% { box-shadow: 0 4px 20px rgba(180,140,200,0.3); }
      50% { box-shadow: 0 4px 30px rgba(180,140,200,0.6), 0 0 0 8px rgba(212,184,232,0.15); }
    }

    /* ══════════════════════════════════════
       EMPTY / LOADING
    ══════════════════════════════════════ */
    .state-msg {
      text-align: center;
      padding: 52px 20px;
      color: var(--soft-text);
    }
    .state-msg .glyph { font-size: 2.5rem; margin-bottom: 14px; opacity: 0.6; }
    .state-msg p { font-size: 0.85rem; font-weight: 300; line-height: 1.7; }

    .loading-ring {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 2px solid rgba(180,140,200,0.2);
      border-top-color: rgba(180,140,200,0.7);
      animation: spin 0.9s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* spacing helpers */
    .mt8 { margin-top: 8px; }
    .mt16 { margin-top: 16px; }
    .mt24 { margin-top: 24px; }
    .mb14 { margin-bottom: 14px; }
  </style>
</head>
<body>

<!-- Metatron SVG -->
<div class="metatron-wrap">

<!-- Main -->
<div class="page">
  <header>

    <div class="header-sub">將心中所願輕輕投入，宇宙會為你顯化</div>

  <nav class="nav-pills">

  <!-- 所有許願 -->
  <section class="section active" id="sec-all">

    <div id="pools-zone">
      <div class="state-msg"><div class="loading-ring"></div><p>正在連結宇宙頻道…</p></div>

  <!-- 新增許願池 -->
  <section class="section" id="sec-add">

          <input type="text" id="a-nick" placeholder="月亮女孩" maxlength="20">
        </div>
        <div class="fgroup">
          <label>生日</label>
          <input type="date" id="a-bday">
        </div>
      </div>
      <div class="fgroup mb14">
        <label>設定密碼（之後編輯用）</label>
        <input type="password" id="a-pw" placeholder="請設定密碼" maxlength="30">

      <div class="form-legend mt24">我的願望</div>

<!-- Modal -->
<div class="modal-veil" id="modal-veil">

<!-- Toast -->

<!-- Music FAB -->
<button class="music-fab" id="music-fab" title="療癒配樂">♪</button>

<script>
  // ════════════════════════════════════════
  // CONFIG — 替換成你的 Supabase 設定
  // ════════════════════════════════════════
  const SUPABASE_URL = 'https://fglcgqnsllenhyhsqmjd.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnbGNncW5zbGxlbmh5aHNxbWpkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MDYxMTYsImV4cCI6MjA5NjQ4MjExNn0.3SMsFrWAzrDOJNb5oQOQi2FqwwxEqAfJX3SYyfW1DU8';
  // ════════════════════════════════════════

  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ── Stars ──
  const sf = document.getElementById('starfield');
  for (let i = 0; i < 55; i++) {
    const s = document.createElement('div');
    const sz = 1.5 + Math.random() * 3;
    s.className = 'star';
    s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2.5+Math.random()*4}s;--delay:${Math.random()*6}s;`;
    sf.appendChild(s);
  }

  // ── Nav ──
  document.querySelectorAll('.pill').forEach(p => {
    p.addEventListener('click', () => {
      document.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('.section').forEach(x => x.classList.remove('active'));
      p.classList.add('active');
      document.getElementById('sec-' + p.dataset.section).classList.add('active');
      if (p.dataset.section === 'all') loadPools();
    });
  });

  // ── Toast ──
  function toast(msg, d = 3200) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), d);
  }

  // ── Modal ──
  function openModal(title, html) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').innerHTML = html;
    document.getElementById('modal-veil').classList.add('open');
  }
  function closeModal() { document.getElementById('modal-veil').classList.remove('open'); }
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-veil').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

  // ── Hash ──
  async function hashPw(pw) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw + '_wishpool_salt'));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  // ── Escape ──
  const esc = s => !s ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  // ══════════════════════════════════════
  // LOAD ALL POOLS
  // ══════════════════════════════════════
  async function loadPools() {
    const zone = document.getElementById('pools-zone');
    zone.innerHTML = '<div class="state-msg"><div class="loading-ring"></div><p>正在連結宇宙頻道…</p></div>';

    const { data, error } = await db
            .from('wish_pools')
            .select('id, nickname, wishes')
            .order('created_at', { ascending: false });

    if (error) {
      zone.innerHTML = `<div class="state-msg"><div class="glyph">🌙</div><p>無法連線<br><small>${esc(error.message)}</small></p></div>`;
      return;
    }

    // Trending
    const counts = {};
    (data || []).forEach(p => (p.wishes || []).filter(w => !w.done).forEach(w => {
      const k = w.name.trim().toLowerCase();
      counts[k] = counts[k] || { n: 0, label: w.name };
      counts[k].n++;
    }));
    const hot = Object.values(counts).filter(v => v.n >= 3).sort((a,b) => b.n - a.n);
    const tz = document.getElementById('trending-zone');
    if (hot.length) {
      tz.innerHTML = `<div class="trending-wrap">
      <div class="trending-title">✦ 大家共同的心願</div>
      <div class="trending-chips">${hot.map(h =>
              `<div class="trending-chip">${esc(h.label)}<span class="chip-count">${h.n}</span></div>`
      ).join('')}</div>
    </div>`;
    } else {
      tz.innerHTML = '';
    }

    if (!data || !data.length) {
      zone.innerHTML = '<div class="state-msg"><div class="glyph">✦</div><p>許願池還是空的<br>成為第一個投下心願的人吧</p></div>';
      return;
    }

    zone.innerHTML = `<div class="pools-list">${data.map(p => poolCard(p)).join('')}</div>`;
  }

  function poolCard(p) {
    const wishes = p.wishes || [];
    const active = wishes.filter(w => !w.done).length;
    const done = wishes.filter(w => w.done).length;
    const char = p.nickname ? p.nickname[0] : '✦';
    return `
  <div class="pool-card" id="pc-${p.id}">
    <div class="pool-header">
      <div class="avatar-ring">
        <div class="avatar-inner">${char}</div>
      </div>
      <div class="pool-meta">
        <div class="pool-name">${esc(p.nickname)}</div>
        <div class="pool-count">${active} 個願望${done > 0 ? `・${done} 個已實現` : ''}</div>
      </div>
      <div class="pool-actions">
        <button class="btn-edit" onclick="promptEdit('${p.id}')">✎ 編輯</button>
        <button class="btn-expand" onclick="togglePool('${p.id}')">▾</button>
      </div>
    </div>
    <div class="wish-collapse" id="wc-${p.id}">
      <div class="wish-list-body">
        ${wishes.length === 0
            ? `<div style="text-align:center;padding:16px;color:var(--soft-text);font-size:0.82rem;">還沒有願望</div>`
            : wishes.map((w,i) => wishRow(w, i, p.id)).join('')}
      </div>
    </div>
  </div>`;
  }

  function wishRow(w, i, pid) {
    const hasDetail = w.link || w.reason;
    return `
  <div class="wish-row">
    <div class="wish-num">${i+1}</div>
    <div class="wish-body">
      <div class="wish-title">
        ${esc(w.name)}
        ${w.done ? '<span class="done-badge">✓ 已實現</span>' : ''}
      </div>
      ${hasDetail ? `<div class="wish-detail" id="wd-${pid}-${i}">
        <div class="wish-detail-inner">
          ${w.link ? `<div>🔗 <a href="${esc(w.link)}" target="_blank" rel="noopener noreferrer">商品連結</a></div>` : ''}
          ${w.reason ? `<div>✦ ${esc(w.reason)}</div>` : ''}
        </div>
      </div>` : ''}
    </div>
    ${hasDetail ? `<button class="btn-detail" onclick="toggleDetail('${pid}',${i})">詳情</button>` : ''}
  </div>`;
  }

  function togglePool(id) {
    const card = document.getElementById('pc-' + id);
    card.classList.toggle('expanded');
  }
  function toggleDetail(pid, i) {
    const el = document.getElementById(`wd-${pid}-${i}`);
    if (el) el.classList.toggle('open');
  }

  // ══════════════════════════════════════
  // EDIT — PASSWORD PROMPT THEN MANAGE
  // ══════════════════════════════════════
  function promptEdit(poolId) {
    openModal('✦ 進入你的許願池', `
    <div class="fgroup mb14">
      <label>密碼</label>
      <input type="password" id="ep-pw" placeholder="請輸入密碼" style="width:100%;background:rgba(255,255,255,0.55);border:1px solid rgba(200,160,220,0.35);border-radius:12px;padding:11px 16px;color:var(--dark-text);font-size:0.88rem;font-family:var(--font-sans);outline:none;">
    </div>
    <button class="btn btn-primary btn-full" onclick="verifyAndEdit('${poolId}')">進入</button>
  `);
    setTimeout(() => document.getElementById('ep-pw')?.focus(), 100);
  }

  async function verifyAndEdit(poolId) {
    const pw = document.getElementById('ep-pw')?.value;
    if (!pw) return toast('請輸入密碼');
    const hash = await hashPw(pw);
    const { data, error } = await db.from('wish_pools').select('*').eq('id', poolId).eq('password_hash', hash).single();
    if (error || !data) return toast('密碼不正確 🌙');
    closeModal();
    showManageModal(data);
  }

  function showManageModal(pool) {
    const renderItems = (wishes) => wishes.map((w,i) => `
    <div class="manage-item" id="mi-${i}">
      <input type="checkbox" ${w.done ? 'checked' : ''} onchange="mgToggleDone(${i},this.checked)">
      <div class="manage-name ${w.done ? 'done' : ''}" id="mn-${i}">${esc(w.name)}</div>
      <button class="btn-micro" onclick="mgEdit(${i})">編輯</button>
      <button class="btn-micro danger" onclick="mgDelete(${i})">刪除</button>
    </div>`).join('');

    openModal(`✦ ${esc(pool.nickname)} 的許願池`, `
    <div id="mg-list">${renderItems(pool.wishes || [])}</div>
    <button class="btn-add-wish mt8" onclick="mgAddNew()" style="width:100%;margin-top:10px">＋ 新增願望</button>
    <div class="mt16">
      <button class="btn btn-primary btn-full" onclick="mgSave('${pool.id}')">儲存變更</button>
    </div>
  `);

    // store on window for closure access
    window._mgPool = JSON.parse(JSON.stringify(pool));
    window._mgRender = () => {
      document.getElementById('mg-list').innerHTML = renderItems(window._mgPool.wishes);
    };
  }

  function mgToggleDone(i, val) {
    window._mgPool.wishes[i].done = val;
    const el = document.getElementById(`mn-${i}`);
    if (el) el.classList.toggle('done', val);
  }

  function mgDelete(i) {
    window._mgPool.wishes.splice(i, 1);
    window._mgRender();
  }

  function mgAddNew() {
    window._mgPool.wishes.push({ name: '新的願望', link: '', reason: '', done: false });
    window._mgRender();
    mgEdit(window._mgPool.wishes.length - 1);
  }

  function mgEdit(i) {
    const w = window._mgPool.wishes[i];
    openModal('✎ 編輯願望', `
    <div class="fgroup mb14">
      <label>商品名稱</label>
      <input type="text" id="me-name" value="${esc(w.name)}" style="width:100%;background:rgba(255,255,255,0.55);border:1px solid rgba(200,160,220,0.35);border-radius:12px;padding:11px 16px;color:var(--dark-text);font-size:0.88rem;font-family:var(--font-sans);outline:none;">
    </div>
    <div class="fgroup mb14">
      <label>商品連結</label>
      <input type="url" id="me-link" value="${esc(w.link||'')}" placeholder="https://..." style="width:100%;background:rgba(255,255,255,0.55);border:1px solid rgba(200,160,220,0.35);border-radius:12px;padding:11px 16px;color:var(--dark-text);font-size:0.88rem;font-family:var(--font-sans);outline:none;">
    </div>
    <div class="fgroup mb14">
      <label>許願原因</label>
      <textarea id="me-reason" style="width:100%;background:rgba(255,255,255,0.55);border:1px solid rgba(200,160,220,0.35);border-radius:12px;padding:11px 16px;color:var(--dark-text);font-size:0.88rem;font-family:var(--font-sans);outline:none;resize:vertical;min-height:80px;">${esc(w.reason||'')}</textarea>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-soft" onclick="showManageModal(window._mgPool)" style="flex:1">← 返回</button>
      <button class="btn btn-primary" onclick="meSave(${i})" style="flex:2">確定</button>
    </div>
  `);
  }

  function meSave(i) {
    window._mgPool.wishes[i].name = document.getElementById('me-name').value.trim() || window._mgPool.wishes[i].name;
    window._mgPool.wishes[i].link = document.getElementById('me-link').value.trim();
    window._mgPool.wishes[i].reason = document.getElementById('me-reason').value.trim();
    showManageModal(window._mgPool);
  }

  async function mgSave(poolId) {
    const { error } = await db.from('wish_pools').update({ wishes: window._mgPool.wishes }).eq('id', poolId);
    if (error) return toast('儲存失敗：' + error.message);
    closeModal();
    toast('✦ 許願池已更新');
    loadPools();
  }

  // ══════════════════════════════════════
  // ADD NEW POOL
  // ══════════════════════════════════════
  let wishCount = 0;
  function addWishFormItem(wish = {}) {
    wishCount++;
    const id = wishCount;
    const el = document.createElement('div');
    el.className = 'wish-form-item';
    el.dataset.wid = id;
    el.innerHTML = `
    <div class="wfi-handle">· · ·</div>
    <button class="wfi-remove" onclick="this.closest('.wish-form-item').remove()">✕</button>
    <div class="fgroup mb14">
      <label>商品名稱</label>
      <input type="text" class="wi-name" placeholder="例：AirPods Pro" value="${esc(wish.name||'')}">
    </div>
    <div class="fgroup mb14">
      <label>商品連結（選填）</label>
      <input type="url" class="wi-link" placeholder="https://..." value="${esc(wish.link||'')}">
    </div>
    <div class="fgroup">
      <label>許願原因（選填）</label>
      <textarea class="wi-reason" placeholder="想要的理由…">${esc(wish.reason||'')}</textarea>
    </div>
  `;
    document.getElementById('wish-form-list').appendChild(el);
  }

  document.getElementById('btn-add-wish-item').addEventListener('click', () => addWishFormItem());

  document.getElementById('btn-submit-pool').addEventListener('click', async () => {
    const nick = document.getElementById('a-nick').value.trim();
    const bday = document.getElementById('a-bday').value;
    const pw = document.getElementById('a-pw').value;
    const items = [...document.querySelectorAll('.wish-form-item')].map(el => ({
      name: el.querySelector('.wi-name').value.trim(),
      link: el.querySelector('.wi-link').value.trim(),
      reason: el.querySelector('.wi-reason').value.trim(),
      done: false
    }));

    if (!nick) return toast('請填寫你的暱稱');
    if (!bday) return toast('請填寫生日');
    if (!pw) return toast('請設定密碼');
    if (!items.length) return toast('請至少加入一個願望');
    if (items.some(w => !w.name)) return toast('每個願望都需要填寫名稱');

    const hash = await hashPw(pw);
    const { data: ex } = await db.from('wish_pools').select('id').eq('nickname', nick).maybeSingle();
    if (ex) return toast('這個暱稱已被使用，請換一個');

    const { error } = await db.from('wish_pools').insert({ nickname: nick, birthday: bday, password_hash: hash, wishes: items });
    if (error) return toast('儲存失敗：' + error.message);

    toast('✦ 願望已投入許願池，宇宙會聽見的', 4000);
    document.getElementById('a-nick').value = '';
    document.getElementById('a-bday').value = '';
    document.getElementById('a-pw').value = '';
    document.getElementById('wish-form-list').innerHTML = '';
    wishCount = 0;

    // switch to all
    document.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.section').forEach(x => x.classList.remove('active'));
    document.querySelector('[data-section="all"]').classList.add('active');
    document.getElementById('sec-all').classList.add('active');
    loadPools();
  });

  // ══════════════════════════════════════
  // MUSIC BOX — Web Audio API (直接版)
  // ══════════════════════════════════════
  let playing = false, audioCtx = null, musicTimer = null, noteIdx = 0;

  // 天空之城 Castle in the Sky — C大調
  // [頻率Hz, 時值秒]  0 = 休止  速度放慢，音符間有充足呼吸
  // 天空之城 1=C ♩=87
  // 四分音符 = 60/87 ≈ 0.69秒
  // 下劃線 = 八分音符 0.345s，附點 = 1.5倍，- = 延音加一拍
  const _q=0.69, _e=0.345, _dq=1.035, _h=1.38, _dh=2.07;
  const C4=261.63,D4=293.66,E4=329.63,F4=349.23,G4=392.00,A4=440.00,B4=493.88;
  const C5=523.25,D5=587.33,E5=659.25,F5=698.46,G5=783.99,A5=880.00,B5=987.77;
  const Fs4=369.99, Fs5=739.99; // #4 = F#

  const SCORE = [
    // 6̲ 7̲ | 1·  7̲ 1  3 | 7 - - 3
    [A4,_e],[B4,_e],
    [C5,_dq],[B4,_e],[C5,_q],[E5,_q],
    [B4,_h],[0,_q],[E5,_q],

    // 6·  5̲ 6  1 | 5 - - 3
    [A5,_dq],[G5,_e],[A5,_q],[C5,_q],
    [G5,_h],[0,_q],[E5,_q],

    // 4·  3̲ 4  1· | 3 - - 1
    [F5,_dq],[E5,_e],[F5,_q],[C5,_dq],
    [E5,_h],[0,_q],[C5,_q],

    // 7·  #4̲ #4  7 | 7 - - 6̲ 7̲
    [B4,_dq],[Fs4,_e],[Fs4,_q],[B4,_q],
    [B4,_h],[0,_e],[A4,_e],[B4,_e],

    // 1·  7̲ 1  3 | 7 - - 3̲ 3̲
    [C5,_dq],[B4,_e],[C5,_q],[E5,_q],
    [B4,_h],[0,_e],[E5,_e],[E5,_e],

    // 6·  5̲ 6  1 | 5 - - 3
    [A5,_dq],[G5,_e],[A5,_q],[C5,_q],
    [G5,_h],[0,_q],[E5,_q],

    // 4  1̲  7·  1 | 2  3̲1̲ 1  -
    [F5,_q],[C5,_e],[B4,_dq],[C5,_q],
    [D5,_q],[E5,_e],[C5,_e],[C5,_q],[0,_q],

    // 1̲7̲ 6  7  #5 | 6 - - 1̲ 2̲
    [C5,_e],[B4,_e],[A4,_q],[B4,_q],[Fs4,_q],
    [A4,_h],[0,_e],[C5,_e],[D5,_e],

    // 3·  2̲ 3  5 | 2 - - 5̲
    [E5,_dq],[D5,_e],[E5,_q],[G5,_q],
    [D5,_h],[0,_e],[G5,_e],

    // 1·  7̲ 1  2̲3̲ | 3 - - -
    [C5,_dq],[B4,_e],[C5,_q],[D5,_e],[E5,_e],
    [E5,_h],[0,_h],

    // 6̲7̲ 1  7̲1̲ 2 | 1·  5̲ 5  -
    [A4,_e],[B4,_e],[C5,_q],[B4,_e],[C5,_e],[D5,_q],
    [C5,_dq],[G4,_e],[G4,_q],[0,_q],

    // 4  3  2  1 | 3 - - 3
    [F5,_q],[E5,_q],[D5,_q],[C5,_q],
    [E5,_h],[0,_q],[E5,_q],

    // 6·  6̲ 5·  5̲ | 3̲2̲ 1  1  -
    [A5,_dq],[A5,_e],[G5,_dq],[G5,_e],
    [E5,_e],[D5,_e],[C5,_q],[C5,_q],[0,_q],

    // 2·  1̲ 2  5 | 3 - - 3
    [D5,_dq],[C5,_e],[D5,_q],[G5,_q],
    [E5,_h],[0,_q],[E5,_q],

    // 6·  6̲ 5·  5̲ | 3̲2̲ 1  1  -
    [A5,_dq],[A5,_e],[G5,_dq],[G5,_e],
    [E5,_e],[D5,_e],[C5,_q],[C5,_q],[0,_q],

    // 2·  1̲ 2  7 | 6 - - 0
    [D5,_dq],[C5,_e],[D5,_q],[B4,_q],
    [A4,_h],[0,_h],
  ];

  function playTine(freq, duration) {
    if (!audioCtx || freq === 0) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const now = audioCtx.currentTime;

    osc.type = 'sine';
    osc.frequency.value = freq;

    // 純粹短促的撥片聲，無泛音無長尾
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.5, now + 0.004);  // 極速起音
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.8); // 短促收音

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.85);
  }

  function tick() {
    if (!playing) return;
    const [freq, dur] = SCORE[noteIdx];
    playTine(freq, dur);
    noteIdx = (noteIdx + 1) % SCORE.length;
    musicTimer = setTimeout(tick, dur * 1000);
  }

  async function startMusic() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    noteIdx = 0;
    tick();
  }

  function stopMusic() {
    if (musicTimer) { clearTimeout(musicTimer); musicTimer = null; }
    if (audioCtx) { try { audioCtx.close(); } catch(e){} audioCtx = null; }
  }

  document.getElementById('music-fab').addEventListener('click', async () => {
    const btn = document.getElementById('music-fab');
    if (playing) {
      playing = false;
      stopMusic();
      btn.textContent = '♪';
      btn.classList.remove('playing');
    } else {
      playing = true;
      btn.textContent = '♬';
      btn.classList.add('playing');
      try {
        await startMusic();
      } catch(e) {
        playing = false;
        btn.textContent = '♪';
        btn.classList.remove('playing');
        console.error(e);
      }
    }
  });

  // 第一次點擊頁面任何地方就自動開始播音樂
  async function autoPlay() {
    if (playing) return;
    const btn = document.getElementById('music-fab');
    playing = true;
    btn.textContent = '♬';
    btn.classList.add('playing');
    try {
      await startMusic();
    } catch(e) {
      playing = false;
      btn.textContent = '♪';
      btn.classList.remove('playing');
    }
  }

  document.addEventListener('click', function onFirstClick() {
    autoPlay();
    document.removeEventListener('click', onFirstClick); // 只觸發一次
  }, { once: true });

  // ── Init ──
  addWishFormItem();
  loadPools();
</script>
</body>
</html>
